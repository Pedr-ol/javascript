<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Axios</title>
    
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="js/global.js" defer></script>
    <script src="js/custom.js" defer></script>
    <script src="js/scripts.js" defer></script>
    <script src="js/interceptors.js"></script>
</head>
<body>
    <h1>Axios</h1>
    <h2>Insira um novo Post:</h2>
    <form id="post-form">
        <div>
            <input type="text" id="title" placeholder="Digite o título do post"/>
        </div>
        <div>
            <textarea id="body" placeholder="Digite o conteúdo do seu post"></textarea>
        </div>
        <input type="submit" value="Criar post"/>
    </form>
    <div id="user-container"></div>
</body>
</html>
